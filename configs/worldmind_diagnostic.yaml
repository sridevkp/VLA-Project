# STAGE 1 TEMPLATE — uncalibrated diagnostic configuration.
#
# Non-circular calibration bootstrap:
#   1. this config (hard checks intact, NO Eq. 3.8 weights, NO approved candidate);
#   2. VALIDATION-only calibration evidence collection on the 18 frozen scenes/seeds;
#   3. owner selection/approval of non-safety parameters from that evidence;
#   4. scored evaluation only with the frozen approved parameters and a `ready` config.
#
# This is a BLOCKED template. Fill only owner-reviewed values. No component formula, unit,
# weight, ranking direction, risk threshold or calibration result is supplied here. This config
# is rejected by `eval-worldmind`; it is accepted only by `worldmind-diagnostic`, which can never
# produce a scored result.
#
# Reconciliation (2026-11-19): FROZEN fields carry source-backed values from ADR-0004, ADR-0016
# and the pinned v5 inspection declaration. REGISTERED fields carry stable identities from
# `eval/worldmind_bindings.py` and `backends/worldmind_bindings.py`; they still require owner
# confirmation before use in a ready/scored config. Every other owner field stays blocked.
schema_version: 1
status: "diagnostic_uncalibrated"
split: "validation"
base_seed: 0
seeds: [0, 1, 2]
episodes: 18

backend:
  kind: "webots"
  declaration: "webots_factory_world_supervisor_geometry_export_v1"
  state_source: "oracle"

task:
  instruction: "<REVIEWED TASK INSTRUCTION>"
  target: "CAN"
  destination: "<DESTINATION ID>"

pipeline:
  proposer: "scripted_chunk_adapter"
  arm: "full_system"
  candidate_count: 32
  horizon_steps: 50
  control_dt_s: 0.032
  decision_seed_base: 0

bounds:
  max_decisions: "<REVIEWED DECISION BOUND>"
  max_steps: "<REVIEWED STEP BOUND>"
  timings_enabled: true

report:
  pdf: "<AUTHORITATIVE REPORT PDF>"
  definitions: "<OWNER-APPROVED DEFINITIONS JSON>"
  candidate_definitions: "report/definitions.candidate.json"
  sha256: "23d5ff15e39c49890e6e20dc1d09b861c072fe5ac8cbc0f0e5aeed8eafa1522b"

assessment:
  required_constraints: ["finite_chunk_v1"]
  hard_checks: ["finite_chunk_v1"]

diagnostic:
  mode: "evidence_collection_only"
  scored_evaluation_allowed: false
  calibration_stage: 1
  evidence_collection_split: "validation"

surrogate:
  binding: "analytic_surrogate_corrected_v1"
  inputs:
    forward: "forward"
    inverse: "inverse"
    validate: "validate"
    tracking: "tracking"

safety:
  binding: "runtime_safety_monitor_v1"
  config_path: "<REVIEWED SAFETY CONFIG>"
  inputs:
    monitor: "monitor"

verification:
  binding: "placement_verifier_v1"
  destination_world: [-1.0, -4.3, 0.821]
  rest_center_world: ["<X M>", "<Y M>", "<Z M>"]
  object_dimensions_m: ["<X M>", "<Y M>", "<Z M>"]
  up_axis_base: ["<X>", "<Y>", "<Z>"]
  distance_tolerance_m: 0.10
  height_tolerance_m: 0.02
  tilt_limit_rad: 0.2617993877991494
  home_tolerance_rad: "<REVIEWED RAD>"
  home_joints:
    "<REVIEWED JOINT NAME>": "<REVIEWED RAD>"

adapter:
  waypoints_binding: "corrected_scripted_waypoints_v1"
  alternate_waypoints_binding: null
  pose_solver_binding: "corrected_bounded_pose_solver_v1"
  ik_position_tolerance_m: "<REVIEWED M>"
  ik_orientation_tolerance_rad: "<REVIEWED RAD>"
  jitter:
    joint_std_rad: "<REVIEWED RAD>"
    joint_limit_rad: "<REVIEWED RAD>"
    max_attempts: "<REVIEWED ATTEMPT BOUND>"
