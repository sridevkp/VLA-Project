<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIAGo chat</title>
<style>
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --ink: #18202b;
    --muted: #667085;
    --line: #d9dfe7;
    --accent: #2f5bea;
    --accent-ink: #ffffff;
    --robot: #f1f4f8;
    --ok: #1f9d63;
    --off: #98a2b3;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141b;
      --panel: #171e28;
      --ink: #e7ebf1;
      --muted: #93a0b2;
      --line: #2a3442;
      --accent: #6d8cff;
      --accent-ink: #0c1220;
      --robot: #202a37;
      --ok: #4cc38a;
      --off: #5b6778;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
  }

  .chat {
    width: 100%;
    max-width: 520px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  /* header */
  .head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .head h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: 0.01em; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); }
  .dot.on { background: var(--ok); }

  /* messages */
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 30ch; }
  .empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

  .msg { max-width: 82%; display: flex; flex-direction: column; gap: 3px; }
  .msg .bubble { padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg time { font-size: 12px; color: var(--muted); }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.user .bubble { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }

  .msg.robot { align-self: flex-start; }
  .msg.robot .bubble { background: var(--robot); border-bottom-left-radius: 4px; border-left: 3px solid var(--accent); }

  .msg.system { align-self: center; max-width: 92%; }
  .msg.system .bubble { background: none; color: var(--muted); font-size: 13px; text-align: center; padding: 2px 8px; }

  .busy { align-self: flex-start; color: var(--muted); font-size: 13px; display: none; }
  .busy.show { display: block; }

  /* quick commands */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 10px; }
  .chip {
    font: inherit; font-size: 13px; color: var(--ink);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }

  /* composer */
  .composer { display: flex; gap: 10px; align-items: flex-end; padding: 12px 18px 18px; border-top: 1px solid var(--line); }
  textarea {
    flex: 1; resize: none; max-height: 140px;
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  }
  textarea::placeholder { color: var(--muted); }
  .send {
    font: inherit; font-weight: 600; color: var(--accent-ink); background: var(--accent);
    border: 0; border-radius: 12px; padding: 10px 18px; cursor: pointer;
  }
  .send:disabled { opacity: 0.45; cursor: default; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  @media (max-width: 560px) { .chat { border: 0; } .msg { max-width: 92%; } }
</style>
</head>
<body>
<main class="chat">
  <header class="head">
    <h1>TIAGo</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Not connected</span></div>
  </header>

  <section class="log" id="log" aria-live="polite" aria-label="Conversation">
    <div class="empty" id="empty">
      <strong>Tell the robot what to do</strong>
      For example: pick up the can and place it on the right.
    </div>
    <div class="busy" id="busy">TIAGo is working…</div>
  </section>

  <div class="chips" id="chips">
    <button class="chip" type="button">Pick up the can</button>
    <button class="chip" type="button">Place it on the right</button>
    <button class="chip" type="button">Stop</button>
  </div>

  <form class="composer" id="form" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Type a command" aria-label="Message to the robot"></textarea>
    <button class="send" id="send" type="submit" disabled>Send</button>
  </form>
</main>

<script>
  // ---------------------------------------------------------------
  // Webots hooks. Wire these two in when you connect the controller:
  //   sendToRobot(text)        -> forward the text to the controller
  //   receiveFromRobot(text)   -> call it with each reply from the controller
  // PREVIEW_MODE echoes a canned reply so the UI can be tried in any browser.
  // ---------------------------------------------------------------
  const PREVIEW_MODE = true;

  function sendToRobot(text) {
    if (PREVIEW_MODE) {
      setBusy(true);
      setTimeout(() => receiveFromRobot("Preview mode: nothing was sent to Webots."), 700);
      return;
    }
    // TODO: send `text` to the controller through the robot window API.
  }

  window.receiveFromRobot = function (text) {
    setBusy(false);
    addMessage("robot", text);
  };

  window.setConnected = function (on) {
    document.getElementById("dot").classList.toggle("on", on);
    document.getElementById("statusText").textContent = on ? "Connected" : "Not connected";
  };

  // ---------------------------------------------------------------
  // UI
  // ---------------------------------------------------------------
  const log = document.getElementById("log");
  const empty = document.getElementById("empty");
  const busy = document.getElementById("busy");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  function timeNow() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function addMessage(role, text) {
    empty.style.display = "none";
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;              // textContent: no HTML injection
    wrap.appendChild(bubble);
    if (role !== "system") {
      const t = document.createElement("time");
      t.textContent = timeNow();
      wrap.appendChild(t);
    }
    log.insertBefore(wrap, busy);
    log.scrollTop = log.scrollHeight;
  }

  function setBusy(on) {
    busy.classList.toggle("show", on);
    log.scrollTop = log.scrollHeight;
  }

  function submit(text) {
    text = text.trim();
    if (!text) return;
    addMessage("user", text);
    sendToRobot(text);
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
    sendBtn.disabled = input.value.trim() === "";
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    submit(input.value);
    input.value = "";
    autosize();
    input.focus();
  });

  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {     // Enter sends, Shift+Enter adds a new line
      e.preventDefault();
      form.requestSubmit();
    }
  });

  document.getElementById("chips").addEventListener("click", (e) => {
    if (e.target.classList.contains("chip")) submit(e.target.textContent);
  });

  if (PREVIEW_MODE) addMessage("system", "Preview mode: this window is not connected to Webots yet.");
  autosize();
</script>
</body>
</html>
