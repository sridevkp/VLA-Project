    { name = "ikpy", marker = "extra == 'sim'", specifier = ">=3.3" },
    { name = "msgpack", specifier = ">=1.0" },
    { name = "numpy", specifier = ">=1.26" },
    { name = "pre-commit", marker = "extra == 'dev'", specifier = ">=4.0" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8.0" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "pyzmq", specifier = ">=26" },
    { name = "ruff", marker = "extra == 'dev'", specifier = ">=0.11" },
    { name = "ty", marker = "extra == 'dev'", specifier = ">=0.0.99,<0.1.0" },
    { name = "typer", specifier = ">=0.12" },
]
provides-extras = ["core", "sim", "perception", "vla", "dashboard", "dev"]

[package.metadata.requires-dev]
dev = [
    { name = "pre-commit", specifier = ">=4.0" },
    { name = "pytest", specifier = ">=8.0" },
    { name = "ruff", specifier = ">=0.11" },
    { name = "ty", specifier = ">=0.0.99,<0.1.0" },
]
